<div class="start">
  @if (showMenuButton()) {
    <button
      mat-icon-button
      type="button"
      class="menu"
      [attr.aria-label]="'header.toggleNav' | translate"
      [attr.aria-expanded]="navOpen()"
      aria-controls="app-navigation"
      (click)="menuToggle.emit()"
    >
      <span aria-hidden="true">☰</span>
    </button>
  }
  <a
    routerLink="/dashboard"
    class="brand"
    [attr.aria-label]="'header.home' | translate: { name: ('app.name' | translate) }"
  >
    <span class="logo">
      <img src="assets/header-logo.svg" [attr.alt]="'app.name' | translate" />
    </span>
    <span class="brand-name">{{ 'app.name' | translate }}</span>
  </a>
</div>

<div class="search" role="search">
  <label class="visually-hidden" for="global-search">{{ 'header.searchLabel' | translate }}</label>
  <span class="search-icon" aria-hidden="true">🔍</span>
  <input
    id="global-search"
    type="search"
    [placeholder]="'header.searchPlaceholder' | translate"
    autocomplete="off"
    [value]="search()"
    (input)="onSearch($event)"
  />
</div>

<div class="end">
  <div class="languages" role="group" [attr.aria-label]="'language.label' | translate">
    <button
      type="button"
      lang="en"
      [class.active]="language.current() === 'en'"
      [attr.aria-pressed]="language.current() === 'en'"
      [attr.title]="'language.english' | translate"
      (click)="language.use('en')"
    >
      <img class="flag" src="assets/flag-en.svg" alt="" />
      EN
    </button>
    <button
      type="button"
      lang="de"
      [class.active]="language.current() === 'de'"
      [attr.aria-pressed]="language.current() === 'de'"
      [attr.title]="'language.german' | translate"
      (click)="language.use('de')"
    >
      <img class="flag" src="assets/flag-de.svg" alt="" />
      DE
    </button>
  </div>

  <button
    mat-icon-button
    type="button"
    class="bell"
    [matBadge]="overdueCount() || null"
    matBadgeColor="warn"
    matBadgeSize="small"
    [title]="'header.notifications' | translate: { count: overdueCount() }"
    [attr.aria-label]="'header.notifications' | translate: { count: overdueCount() }"
    (click)="showOverdue.emit()"
  >
    <span aria-hidden="true">🔔</span>
  </button>

  <button
    type="button"
    class="profile"
    [matMenuTriggerFor]="profileMenu"
    [attr.aria-label]="'header.account' | translate: { avatar: user().avatar, name: user().name }"
  >
    <app-avatar [name]="user().name" [initials]="user().avatar" [size]="32" />
  </button>
  <mat-menu #profileMenu="matMenu" xPosition="before">
    <div class="profile-card" role="presentation">
      <strong>{{ user().name }}</strong>
      <span>{{ user().email }}</span>
    </div>
    <a mat-menu-item routerLink="/settings">{{ 'header.settings' | translate }}</a>
  </mat-menu>
</div>
