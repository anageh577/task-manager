<div class="top">
  <app-priority-badge [priority]="task().priority" />
  <button
    mat-icon-button
    type="button"
    class="menu-trigger"
    [matMenuTriggerFor]="actions"
    [attr.aria-label]="'Actions for ' + task().title"
  >
    <span aria-hidden="true">⋮</span>
  </button>
</div>

<h3 class="title" [id]="titleId()">{{ task().title }}</h3>
@if (task().description) {
  <p class="description">{{ task().description }}</p>
}

<p class="due" [class]="'due ' + due().tone">
  <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
    <path fill="currentColor" [attr.d]="dueIcon()" />
  </svg>
  {{ due().label }}
</p>

@if (task().tags.length) {
  <ul class="tags" aria-label="Tags">
    @for (tag of task().tags; track tag) {
      <li>{{ tag }}</li>
    }
  </ul>
}

<div class="footer">
  <app-avatar [name]="task().assignee.name" [initials]="task().assignee.avatar" [size]="22" />
  <span class="assignee">
    <span class="visually-hidden">Assigned to </span>{{ assigneeHandle() }}
  </span>
</div>

<mat-menu #actions="matMenu" xPosition="before">
  <button mat-menu-item type="button" (click)="edit.emit(task())">
    <span aria-hidden="true">✏️</span> Edit
  </button>
  @for (target of moveTargets(); track target.status) {
    <button
      mat-menu-item
      type="button"
      (click)="statusChange.emit({ task: task(), status: target.status })"
    >
      <span aria-hidden="true">➡️</span> Move to {{ target.label }}
    </button>
  }
  <button mat-menu-item type="button" class="danger" (click)="delete.emit(task())">
    <span aria-hidden="true">🗑️</span> Delete
  </button>
</mat-menu>
