<div class="tabs" role="group" [attr.aria-label]="'filter.status' | translate">
  @for (tab of statusTabs; track tab.value) {
    <button
      type="button"
      class="tab"
      [class.active]="filters().status === tab.value"
      [attr.aria-pressed]="filters().status === tab.value"
      (click)="setStatus(tab.value)"
    >
      {{ (tab.value === all ? 'filter.all' : 'status.' + tab.value) | translate }}
    </button>
  }
</div>

<div class="actions">
  @if (hasActiveFilters()) {
    <button mat-button type="button" class="clear" (click)="resetFilters.emit()">
      {{ 'action.clearFilters' | translate }}
    </button>
  }

  <button
    mat-stroked-button
    type="button"
    class="menu-button"
    [class.selected]="filters().assigneeId !== all"
    [matMenuTriggerFor]="assigneeMenu"
  >
    {{ assigneeLabel() }} <span aria-hidden="true">▾</span>
  </button>
  <mat-menu #assigneeMenu="matMenu" xPosition="before">
    <button
      mat-menu-item
      type="button"
      role="menuitemradio"
      [attr.aria-checked]="filters().assigneeId === all"
      (click)="setAssignee(all)"
    >
      {{ 'filter.allAssignees' | translate }}
    </button>
    @for (user of users(); track user.id) {
      <button
        mat-menu-item
        type="button"
        role="menuitemradio"
        [attr.aria-checked]="filters().assigneeId === user.id"
        (click)="setAssignee(user.id)"
      >
        {{ user.name }}
      </button>
    }
  </mat-menu>

  <button
    mat-stroked-button
    type="button"
    class="menu-button"
    [class.selected]="filters().priority !== all"
    [matMenuTriggerFor]="priorityMenu"
  >
    {{ priorityLabel() }} <span aria-hidden="true">▾</span>
  </button>
  <mat-menu #priorityMenu="matMenu" xPosition="before">
    <button
      mat-menu-item
      type="button"
      role="menuitemradio"
      [attr.aria-checked]="filters().priority === all"
      (click)="setPriority(all)"
    >
      {{ 'filter.allPriorities' | translate }}
    </button>
    @for (priority of priorities; track priority) {
      <button
        mat-menu-item
        type="button"
        role="menuitemradio"
        [attr.aria-checked]="filters().priority === priority"
        (click)="setPriority(priority)"
      >
        {{ 'priority.' + priority | translate }}
      </button>
    }
  </mat-menu>

  <button mat-flat-button type="button" class="new-task" (click)="newTask.emit()">
    + {{ 'action.newTask' | translate }}
  </button>
</div>
